<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Listas">
  <title>Mis Listas</title>
  <style>
    :root {
      --bg: #f4f3fb;
      --bg-grad: radial-gradient(1200px 500px at 10% -10%, #e4e1ff 0%, transparent 60%),
                 radial-gradient(900px 400px at 110% 0%, #ffe3ea 0%, transparent 55%);
      --card: #ffffff;
      --text: #17162b;
      --muted: #7a7891;
      --accent: #5b4cf0;
      --accent-2: #ff5c8a;
      --accent-soft: #ecebff;
      --chip: #f1f0f8;
      --border: rgba(23, 22, 43, 0.07);
      --shadow: 0 1px 2px rgba(23, 22, 43, 0.04), 0 6px 18px rgba(23, 22, 43, 0.06);
      --input: rgba(255, 255, 255, 0.85);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f17;
        --bg-grad: radial-gradient(1200px 500px at 10% -10%, #231f55 0%, transparent 60%),
                   radial-gradient(900px 400px at 110% 0%, #3a1630 0%, transparent 55%);
        --card: #1a1a26;
        --text: #f1f0fa;
        --muted: #9a98b3;
        --accent: #8e83ff;
        --accent-2: #ff7aa2;
        --accent-soft: #29264d;
        --chip: #26253a;
        --border: rgba(255, 255, 255, 0.06);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        --input: rgba(26, 26, 38, 0.85);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-grad), var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top) + 16px) 20px 12px;
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      background: color-mix(in srgb, var(--bg) 75%, transparent);
    }
    .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .fecha { color: var(--muted); font-size: 0.85rem; font-weight: 500; }

    .search {
      margin-top: 12px;
      position: relative;
    }
    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .search input {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 40px 12px 42px;
      outline: none;
      box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .search .clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: var(--chip);
      color: var(--muted);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }
    .search.has-text .clear { display: block; }

    .tabs {
      margin-top: 14px;
      display: flex;
      gap: 6px;
      padding: 5px;
      background: var(--chip);
      border-radius: 16px;
    }
    .tab {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      font-size: 0.98rem;
      padding: 10px 8px;
      min-height: 46px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    @media (max-width: 400px) {
      .tab { font-size: 0.9rem; gap: 5px; padding: 10px 4px; }
      .tab svg { width: 18px; height: 18px; }
    }
    .tab svg { width: 20px; height: 20px; flex-shrink: 0; }
    .tab[aria-selected="true"] {
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .tab[aria-selected="true"] svg { color: var(--accent); }
    .count {
      min-width: 26px;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }
    .tab[aria-selected="true"] .count {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    main { padding: 8px 20px calc(env(safe-area-inset-bottom) + 32px); }
    .resumen {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 10px 4px 12px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    @media (min-width: 700px) {
      ul.compra { grid-template-columns: 1fr 1fr; }
      h1 { font-size: 2.4rem; }
    }
    li {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      animation: entra .35s ease both;
    }
    @keyframes entra {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    li {
      transition: opacity .25s, transform .25s, background .2s;
    }
    li.saliendo {
      animation: sale .32s ease forwards;
    }
    @keyframes sale {
      to { opacity: 0; transform: translateX(24px) scale(.97); }
    }
    .check {
      appearance: none;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      margin: -4px -4px -4px -6px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .check .circulo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--muted) 55%, transparent);
      display: grid;
      place-items: center;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .check:active .circulo { transform: scale(.88); }
    .check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
    .check:focus-visible .circulo { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
    li.hecho .check .circulo,
    li.saliendo .check .circulo {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }
    li.hecho .check svg,
    li.saliendo .check svg { opacity: 1; }
    li.hecho { background: color-mix(in srgb, var(--card) 60%, transparent); box-shadow: none; }
    li.hecho .item-nombre {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: var(--muted);
      color: var(--muted);
    }
    li.hecho .chip { opacity: .6; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      transform: translate(-50%, 120%);
      opacity: 0;
      width: calc(100% - 32px);
      max-width: 480px;
      background: var(--text);
      color: var(--bg);
      border-radius: 16px;
      padding: 10px 10px 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      transition: transform .25s ease, opacity .25s ease;
      z-index: 20;
      pointer-events: none;
    }
    .toast.visible { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .toast span { flex: 1; min-width: 0; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--accent-2);
      font: inherit;
      font-weight: 700;
      padding: 10px 12px;
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
    }
    .item-body { min-width: 0; flex: 1; }
    .item-nombre {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      word-wrap: break-word;
    }
    .item-meta {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--chip);
      border-radius: 999px;
      padding: 3px 9px;
    }
    .chip.tienda {
      color: var(--accent);
      background: var(--accent-soft);
    }
    mark {
      background: color-mix(in srgb, var(--accent-2) 30%, transparent);
      color: inherit;
      border-radius: 4px;
      padding: 0 2px;
    }

    .empty, .error {
      text-align: center;
      padding: 56px 24px;
      color: var(--muted);
    }
    .empty .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }
    .empty strong { display: block; color: var(--text); font-size: 1.15rem; margin-bottom: 6px; }
    .error { color: #ff453a; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-row">
        <h1>Mis Listas</h1>
        <span class="fecha" id="fecha"></span>
      </div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar en la lista…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="limpiar" aria-label="Borrar búsqueda">✕</button>
      </div>
    </header>
    <main id="contenido" role="tabpanel"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastTexto"></span>
    <button id="deshacer" type="button">Deshacer</button>
  </div>

  <script>
    const LISTAS = {
      "compra": {
        nombre: "Compra",
        icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h2.6l2.4 12.2a1.5 1.5 0 0 0 1.5 1.2h8.9a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/></svg>',
        vacia: ["🛒", "¡Despensa a tope!", "No hay nada que comprar. Dime «apúntame…» cuando falte algo."],
        // Al marcar: se tacha y se queda en la lista
        alMarcar: "tachar",
        textoHecho: "comprado",
        textoHechos: "comprados"
      },
      "tareas-ideas": {
        nombre: "Tareas e ideas",
        icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3Z"/></svg>',
        vacia: ["💡", "Mente despejada", "No hay tareas ni ideas pendientes. ¡Buen momento para pensar en grande!"],
        // Al marcar: desaparece de la lista
        alMarcar: "borrar"
      }
    };

    // Los marcados se guardan en este navegador (la página no puede escribir en listas.json).
    // Formato: { "compra": ["texto", …], "tareas-ideas": ["texto", …] }
    const CLAVE_GUARDADO = "mis-listas:marcados";
    let marcados = {};

    function cargarMarcados() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || "{}");
        marcados = guardado && typeof guardado === "object" ? guardado : {};
      } catch (e) {
        marcados = {};
      }
    }

    function guardarMarcados() {
      try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(marcados)); } catch (e) { /* sin almacenamiento: solo dura esta visita */ }
    }

    // Olvida marcas de elementos que ya no están en listas.json,
    // para que si se vuelve a apuntar algo igual aparezca sin marcar.
    function limpiarMarcados() {
      const limpio = {};
      Object.keys(listas).forEach(clave => {
        const textos = new Set(listas[clave].map(textoItem));
        const m = (marcados[clave] || []).filter(t => textos.has(t));
        if (m.length) limpio[clave] = m;
      });
      marcados = limpio;
      guardarMarcados();
    }

    function estaMarcado(clave, texto) {
      return (marcados[clave] || []).includes(texto);
    }

    function marcar(clave, texto, valor) {
      const set = new Set(marcados[clave] || []);
      if (valor) set.add(texto); else set.delete(texto);
      marcados[clave] = [...set];
      guardarMarcados();
    }

    function modo(clave) {
      return (LISTAS[clave] && LISTAS[clave].alMarcar) || "tachar";
    }

    // Elementos que se ven en la lista (los borrados al completarse no cuentan)
    function visibles(clave) {
      const items = (listas[clave] || []).map(textoItem);
      return modo(clave) === "borrar" ? items.filter(t => !estaMarcado(clave, t)) : items;
    }

    function pendientes(clave) {
      return visibles(clave).filter(t => !estaMarcado(clave, t)).length;
    }

    const toastEl = document.getElementById("toast");
    const toastTextoEl = document.getElementById("toastTexto");
    let toastTimer = null;
    let deshacerAccion = null;

    function mostrarToast(texto, accion) {
      toastTextoEl.textContent = texto;
      deshacerAccion = accion;
      toastEl.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(ocultarToast, 5000);
    }

    function ocultarToast() {
      toastEl.classList.remove("visible");
      deshacerAccion = null;
    }

    document.getElementById("deshacer").addEventListener("click", () => {
      const accion = deshacerAccion;
      ocultarToast();
      if (accion) accion();
    });

    const tabsEl = document.getElementById("tabs");
    const contenidoEl = document.getElementById("contenido");
    const buscarEl = document.getElementById("buscar");
    const searchBox = document.getElementById("searchBox");
    let listas = {};
    let activa = null;

    document.getElementById("fecha").textContent =
      new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "short" });

    function textoItem(item) {
      if (typeof item === "string") return item;
      if (item && typeof item === "object") return item.texto || item.nombre || item.titulo || JSON.stringify(item);
      return String(item);
    }

    // "Tomate – 1 ud (100 g) · Lidl/Aldi" → nombre, cantidad, tienda
    function partes(texto) {
      let nombre = texto, cantidad = "", tienda = "";
      const iTienda = nombre.lastIndexOf(" · ");
      if (iTienda > -1) { tienda = nombre.slice(iTienda + 3).trim(); nombre = nombre.slice(0, iTienda); }
      const iCant = nombre.indexOf(" – ");
      if (iCant > -1) { cantidad = nombre.slice(iCant + 3).trim(); nombre = nombre.slice(0, iCant); }
      return { nombre: nombre.trim(), cantidad, tienda };
    }

    function normaliza(s) {
      return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function resalta(texto, q) {
      const span = document.createElement("span");
      if (!q) { span.textContent = texto; return span; }
      const i = normaliza(texto).indexOf(normaliza(q));
      if (i < 0) { span.textContent = texto; return span; }
      span.append(texto.slice(0, i));
      const m = document.createElement("mark");
      m.textContent = texto.slice(i, i + q.length);
      span.append(m, texto.slice(i + q.length));
      return span;
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      Object.keys(listas).forEach(clave => {
        const info = LISTAS[clave] || { nombre: clave, icono: "" };
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", clave === activa);
        btn.innerHTML = info.icono;
        const label = document.createElement("span");
        label.textContent = info.nombre;
        const c = document.createElement("span");
        c.className = "count";
        c.textContent = pendientes(clave);
        btn.append(label, c);
        btn.addEventListener("click", () => seleccionar(clave));
        tabsEl.appendChild(btn);
      });
    }

    function vacio(emoji, titulo, texto) {
      const div = document.createElement("div");
      div.className = "empty";
      const e = document.createElement("span"); e.className = "emoji"; e.textContent = emoji;
      const t = document.createElement("strong"); t.textContent = titulo;
      const p = document.createElement("span"); p.textContent = texto;
      div.append(e, t, p);
      return div;
    }

    function renderLista() {
      const items = visibles(activa);
      const q = buscarEl.value.trim();
      contenidoEl.innerHTML = "";

      if (items.length === 0) {
        const v = (LISTAS[activa] && LISTAS[activa].vacia) || ["📭", "Lista vacía", "Aún no hay nada aquí."];
        contenidoEl.appendChild(vacio(...v));
        return;
      }

      const filtrados = q ? items.filter(t => normaliza(t).includes(normaliza(q))) : items;
      if (filtrados.length === 0) {
        contenidoEl.appendChild(vacio("🔍", "Sin resultados", "Nada coincide con «" + q + "»."));
        return;
      }

      const resumen = document.createElement("div");
      resumen.className = "resumen";
      resumen.textContent = textoResumen();
      contenidoEl.appendChild(resumen);

      const ul = document.createElement("ul");
      ul.className = activa;
      const clave = activa;
      filtrados.forEach((texto, i) => {
        const p = partes(texto);
        const li = document.createElement("li");
        li.style.animationDelay = Math.min(i * 25, 300) + "ms";
        const hecho = estaMarcado(clave, texto);
        li.classList.toggle("hecho", hecho);

        const check = document.createElement("button");
        check.type = "button";
        check.className = "check";
        check.setAttribute("aria-pressed", hecho);
        check.setAttribute("aria-label",
          (hecho ? "Desmarcar " : (clave === "compra" ? "Marcar como comprado: " : "Marcar como hecho: ")) + p.nombre);
        check.innerHTML = '<span class="circulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>';
        check.addEventListener("click", () => alPulsar(clave, texto, li));

        const body = document.createElement("div");
        body.className = "item-body";
        const nom = document.createElement("div");
        nom.className = "item-nombre";
        nom.appendChild(resalta(p.nombre, q));
        body.appendChild(nom);

        if (p.cantidad || p.tienda) {
          const meta = document.createElement("div");
          meta.className = "item-meta";
          if (p.cantidad) { const c = document.createElement("span"); c.className = "chip"; c.textContent = p.cantidad; meta.appendChild(c); }
          if (p.tienda) { const t = document.createElement("span"); t.className = "chip tienda"; t.textContent = p.tienda; meta.appendChild(t); }
          body.appendChild(meta);
        }

        li.append(check, body);
        ul.appendChild(li);
      });
      contenidoEl.appendChild(ul);
    }

    function textoResumen() {
      const items = visibles(activa);
      const q = buscarEl.value.trim();
      const info = LISTAS[activa] || {};
      const n = q ? items.filter(t => normaliza(t).includes(normaliza(q))).length : items.length;
      let txt = q
        ? n + " de " + items.length + " elementos"
        : items.length + (items.length === 1 ? " elemento" : " elementos");
      const hechos = items.filter(t => estaMarcado(activa, t)).length;
      if (hechos && info.textoHecho) {
        txt += " · " + hechos + " " + (hechos === 1 ? info.textoHecho : info.textoHechos);
      }
      return txt;
    }

    function alPulsar(clave, texto, li) {
      if (modo(clave) === "borrar") {
        // Ideas/tareas: se marca como hecha y desaparece (con opción de deshacer)
        if (li.classList.contains("saliendo")) return;
        marcar(clave, texto, true);
        li.classList.add("saliendo");
        li.style.animationDelay = "0ms";
        setTimeout(() => { renderTabs(); renderLista(); }, 320);
        mostrarToast("Hecho: " + partes(texto).nombre, () => {
          marcar(clave, texto, false);
          renderTabs();
          renderLista();
        });
      } else {
        // Compra: se tacha o se destacha (sin redibujar la lista, para que no parpadee)
        const hecho = !estaMarcado(clave, texto);
        marcar(clave, texto, hecho);
        li.classList.toggle("hecho", hecho);
        li.style.animation = "none";
        const check = li.querySelector(".check");
        check.setAttribute("aria-pressed", hecho);
        check.setAttribute("aria-label", (hecho ? "Desmarcar " : "Marcar como comprado: ") + partes(texto).nombre);
        renderTabs();
        const resumen = contenidoEl.querySelector(".resumen");
        if (resumen) resumen.textContent = textoResumen();
      }
    }

    function seleccionar(clave) {
      activa = clave;
      history.replaceState(null, "", "#" + clave);
      renderTabs();
      renderLista();
    }

    buscarEl.addEventListener("input", () => {
      searchBox.classList.toggle("has-text", buscarEl.value.length > 0);
      renderLista();
    });
    document.getElementById("limpiar").addEventListener("click", () => {
      buscarEl.value = "";
      searchBox.classList.remove("has-text");
      renderLista();
      buscarEl.focus();
    });

    fetch("listas.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(datos => {
        listas = datos;
        cargarMarcados();
        limpiarMarcados();
        const claves = Object.keys(listas);
        const desdeHash = decodeURIComponent(location.hash.slice(1));
        seleccionar(claves.includes(desdeHash) ? desdeHash : claves[0]);
      })
      .catch(err => {
        contenidoEl.innerHTML = "";
        const p = document.createElement("p");
        p.className = "error";
        p.textContent = "No se pudo cargar listas.json (" + err.message + ").";
        contenidoEl.appendChild(p);
      });
  </script>
</body>
</html>
